<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico" sizes="16x16" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人导航 | My Nav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#0b0f19',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .scroll-container {
            -webkit-overflow-scrolling: touch;
            mask-image: linear-gradient(to right, transparent, black 12px, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12px, black calc(100% - 12px), transparent 100%);
        }
        /* 图片加载前的平滑过渡 */
        .favicon-img { opacity: 0; transition: opacity 0.4s ease-in-out; }
        .favicon-img.loaded { opacity: 1; }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-b border-gray-200/50 dark:border-gray-800/50 shadow-sm transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-3">
            <div class="font-bold text-lg tracking-tight text-blue-600 dark:text-blue-500 shrink-0 cursor-pointer active:opacity-70 transition-opacity" onclick="resetView()">
                PasserJ's Nav
            </div>

            <div class="flex-1 max-w-lg">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" 
                        class="block w-full pl-9 pr-3 py-2 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-100/50 dark:bg-gray-800/50 placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-black focus:ring-2 focus:ring-blue-500/30 transition-all text-sm"
                        placeholder="搜索... (按下 / 聚焦, Esc 取消)">
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-0 sm:px-6 lg:px-8 py-4 min-h-[50vh]" id="mainContainer">
        <div id="projectsContainer" class="space-y-8 pb-10">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 px-4 sm:px-0">
                <div class="h-20 bg-gray-200 dark:bg-gray-800 rounded-2xl animate-pulse-slow"></div>
                <div class="h-20 bg-gray-200 dark:bg-gray-800 rounded-2xl animate-pulse-slow"></div>
            </div>
        </div>
        <div id="searchResultsContainer" class="hidden px-4 sm:px-0 space-y-8 pb-10"></div>
    </main>

    <script>
        let fullData = null;
        let projectKeys = [];
        let activeCategories = {};

        // === 1. 核心工具函数 ===
        const debounce = (fn, delay) => {
            let timer = null;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        };

        const getIconUrl = (domain) => `https://favicon.yandex.net/favicon/${domain}?size=32`;

        // === 2. 图片处理逻辑 (解决闪烁) ===
        window.handleImageLoad = function (img) {
            if (img.naturalWidth === 1 && img.naturalHeight === 1) {
                handleImageError(img);
            } else {
                img.classList.add('loaded'); // 加载成功后再显示，配合 CSS 过渡
            }
        };

        window.handleImageError = function (img) {
            if (img.dataset.state === 'failed') return;
            if (!img.dataset.triedDirect) {
                img.dataset.triedDirect = 'true';
                try {
                    const url = new URL(img.dataset.url);
                    img.src = `${url.origin}/favicon.ico`;
                } catch (e) { fail(img); }
            } else { fail(img); }
        };

        function fail(img) {
            img.dataset.state = 'failed';
            img.style.display = 'none'; // 彻底隐藏，露出底下的首字母
        }

        // === 3. 初始化与数据处理 ===
        async function init() {
            const CACHE_KEY = 'nav_data_cache';
            const container = document.getElementById('projectsContainer');
            const cachedString = localStorage.getItem(CACHE_KEY);

            if (cachedString) {
                try {
                    fullData = JSON.parse(cachedString);
                    processAndRender();
                } catch (e) { localStorage.removeItem(CACHE_KEY); }
            }

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const newData = await response.json();
                if (JSON.stringify(newData) !== cachedString) {
                    fullData = newData;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(newData));
                    processAndRender();
                }
            } catch (error) {
                if (!fullData) {
                    container.innerHTML = `<div class="text-center text-red-500 py-10 animate-fade-in">加载失败，请检查网络</div>`;
                }
            }
        }

        function processAndRender() {
            projectKeys = Object.keys(fullData);
            projectKeys.forEach(key => { if (!(key in activeCategories)) activeCategories[key] = 0; });
            renderAllProjects();
        }

        // === 4. 渲染逻辑 ===
        function createCard(item) {
            const domain = extractHostname(item.url);
            const primaryIcon = getIconUrl(domain);
            const safeName = item.name?.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) || '';
            const safeDesc = item.desc?.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) || '';
            const bgColor = getColorFromName(safeName);

            return `
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
               class="group relative flex items-center p-3 sm:p-4 bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800/60 shadow-sm hover:shadow-xl hover:-translate-y-0.5 hover:border-blue-500/40 dark:hover:border-blue-500/40 transition-all duration-300 h-full overflow-hidden dark:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]">
                
                <div class="flex-shrink-0 mr-3 w-10 h-10 rounded-full overflow-hidden relative bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center justify-center text-white text-xs font-bold select-none z-0" style="background-color: ${bgColor};">
                        ${safeName.charAt(0).toUpperCase()}
                    </div>
                    <img src="${primaryIcon}" data-url="${item.url}" alt="${safeName}" 
                         class="favicon-img relative z-10 w-full h-full object-contain p-1.5 bg-white dark:bg-gray-800"
                         onload="handleImageLoad(this)" onerror="handleImageError(this)" loading="lazy" />
                </div>

                <div class="flex-1 min-w-0">
                    <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 truncate transition-colors">
                        ${safeName}
                    </h3>
                    <p class="text-[10px] sm:text-xs text-gray-400 dark:text-gray-500 truncate mt-0.5">
                        ${safeDesc || domain}
                    </p>
                </div>
            </a>`;
        }

        function renderAllProjects() {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = projectKeys.map((key, idx) => {
                const categories = fullData[key];
                const gridsHTML = categories.map((cat, catIdx) => `
                    <div id="grid-${key}-${catIdx}" class="${catIdx === activeCategories[key] ? 'grid animate-fade-in' : 'hidden'} grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
                        ${cat.items.map(item => createCard(item)).join('')}
                    </div>
                `).join('');

                return `
                <section class="animate-fade-in">
                    ${idx !== 0 ? '<div class="h-px bg-gray-100 dark:bg-gray-800/60 mx-4 sm:mx-0 mb-6"></div>' : ''}
                    <div class="relative mb-4 px-4 sm:px-1">
                         <nav id="tabs-${key}" class="scroll-container flex space-x-2 overflow-x-auto pb-2">
                            ${categories.map((cat, i) => `
                                <button onclick="switchCategory('${key}', ${i}, this)" 
                                    class="shrink-0 px-4 py-2 rounded-xl text-sm font-medium transition-all duration-300 ${i === activeCategories[key] 
                                        ? 'bg-gray-800 text-white dark:bg-gray-100 dark:text-gray-900 shadow-md font-bold' 
                                        : 'bg-white text-gray-600 border border-gray-100 dark:bg-gray-800/40 dark:text-gray-400 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800'}">
                                    ${cat.category}
                                </button>`).join('')}
                         </nav>
                    </div>
                    <div class="px-4 sm:px-0">${gridsHTML}</div>
                </section>`;
            }).join('');
        }

        // === 5. 交互与搜索 ===
        window.switchCategory = function (key, index, btn) {
            if (activeCategories[key] === index) return;
            const oldIdx = activeCategories[key];
            activeCategories[key] = index;
            
            document.getElementById(`grid-${key}-${oldIdx}`).classList.replace('grid', 'hidden');
            document.getElementById(`grid-${key}-${index}`).classList.replace('hidden', 'grid');
            
            const btns = btn.parentElement.children;
            for (let b of btns) b.className = b.className.replace(/bg-gray-800|dark:bg-gray-100|text-white|dark:text-gray-900|font-bold/g, '').trim() + ' bg-white text-gray-600 dark:bg-gray-800/40 dark:text-gray-400';
            btn.className = 'shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 bg-gray-800 text-white dark:bg-gray-100 dark:text-gray-900 shadow-md';
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        };

        const performSearch = debounce((val) => {
            const resultsDiv = document.getElementById('searchResultsContainer');
            if (!val) { toggleSearchMode(false); return; }
            
            toggleSearchMode(true);
            let matched = [];
            projectKeys.forEach(p => fullData[p].forEach(c => {
                const items = c.items.filter(i => (i.name + i.desc + i.url).toLowerCase().includes(val.toLowerCase()));
                if (items.length) matched.push({ title: c.category, items });
            }));

            resultsDiv.innerHTML = matched.length ? matched.map(g => `
                <div class="animate-fade-in">
                    <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider pl-1">${g.title}</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">${g.items.map(i => createCard(i)).join('')}</div>
                </div>`).join('') : `<div class="text-center py-20 opacity-50">未找到 "${val}"，按 Enter 搜索 Google</div>`;
        }, 250);

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => performSearch(e.target.value.trim()));

        window.resetView = () => {
            searchInput.value = '';
            toggleSearchMode(false);
            searchInput.blur();
        };

        function toggleSearchMode(isSearch) {
            document.getElementById('projectsContainer').classList.toggle('hidden', isSearch);
            document.getElementById('searchResultsContainer').classList.toggle('hidden', !isSearch);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') resetView();
            if (e.key === 'Enter' && searchInput.value) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(searchInput.value)}`, '_blank');
            }
        });

        function extractHostname(u) { try { return new URL(u).hostname; } catch { return ''; } }
        function getColorFromName(n) {
            const colors = ["#1abc9c", "#2ecc71", "#3498db", "#9b59b6", "#e67e22", "#e74c3c"];
            let hash = 0;
            for (let i = 0; i < n.length; i++) hash = n.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        init();
    </script>
</body>
</html>
