<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico" sizes="16x16" type="image/x-icon">
    <link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <!-- 允许用户缩放，保证移动端可读性 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="个人私有导航页">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
    <title>个人导航 | My Nav</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind 运行期配置：跟随系统深色模式
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#0b0f19' }
                    }
                }
            }
        }
    </script>

    <style>
        /* ===== 基础 ===== */
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* [hidden] 需要压过 Tailwind 的 display 工具类 */
        [hidden] { display: none !important; }

        ::-webkit-scrollbar { width: 0; height: 0; }

        /* 横向标签栏：两端渐隐，滚动更顺滑 */
        .scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            mask-image: linear-gradient(to right, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
        }

        /* favicon 加载完成后淡入，避免闪烁 */
        .favicon-img { opacity: 0; transition: opacity .35s ease-in-out; }
        .favicon-img.loaded { opacity: 1; }

        /* 统一的入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: none; }
        }
        .fade-in { animation: fadeIn .26s ease-out both; }

        /* 键盘可达性 */
        :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

        /* ===== 编辑态小按钮 ===== */
        .ebtn {
            flex-shrink: 0;
            height: 22px;
            min-width: 22px;
            padding: 0 6px;
            border-radius: 6px;
            font-size: 11.5px;
            line-height: 1;
            font-weight: 500;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #6b7280;
            cursor: pointer;
            transition: background-color .15s, color .15s, border-color .15s;
        }
        .ebtn:hover { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
        .ebtn-danger:hover { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
        .ebtn:disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }

        /* ===== 分类「分组」选择器（编辑态标签栏）===== */
        .cat-group-sel {
            flex-shrink: 0;
            height: 22px;
            max-width: 96px;
            padding: 0 15px 0 5px;
            border-radius: 6px;
            font-size: 11.5px;
            line-height: 1;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            background-color: #fff;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' fill='none' stroke='%239ca3af' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 3px center;
            background-size: 10px 10px;
            appearance: none;
            -webkit-appearance: none;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color .15s, border-color .15s, color .15s;
        }
        .cat-group-sel:hover { border-color: #bfdbfe; color: #2563eb; background-color: #eff6ff; }
        .cat-group-sel:focus { outline: none; border-color: #93c5fd; box-shadow: 0 0 0 2px rgba(59, 130, 246, .25); }
        .cat-group-sel:disabled { opacity: .55; cursor: default; }
        @media (prefers-color-scheme: dark) {
            .ebtn { background: #1f2937; border-color: #374151; color: #9ca3af; }
            .ebtn:hover { background: #1e3a5f; border-color: #1d4ed8; color: #60a5fa; }
            .ebtn-danger:hover { background: #3f1d1d; border-color: #7f1d1d; color: #f87171; }

            .cat-group-sel {
                background-color: #1f2937;
                border-color: #374151;
                color: #9ca3af;
                background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' fill='none' stroke='%236b7280' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            }
            .cat-group-sel:hover { background-color: #1e3a5f; border-color: #1d4ed8; color: #60a5fa; }
        }
        /* ===== 编辑态：分组 / 分类折叠 ===== */

        /* 标题栏本身是折叠开关：整行可点，箭头在最左 */
        .edit-toggle {
            display: flex;
            align-items: center;
            gap: 3px;
            flex: 1 1 auto;
            min-width: 0;
            padding: 0;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
            color: inherit;
        }
        .edit-toggle .chev { color: #b6bcc6; transition: transform .18s ease, color .15s; }
        .edit-toggle:hover .chev { color: #2563eb; }
        .edit-toggle:hover > span:first-of-type { color: #1d4ed8; }
        /* 折叠时箭头转向右，一眼看出「收起来了」 */
        .is-collapsed .edit-toggle .chev { transform: rotate(-90deg); }

        /* 只在折叠时出现的补充信息（如「· 52 条目」） */
        [data-collapse-only] { display: none; }
        .is-collapsed [data-collapse-only] { display: inline; }

        /* 折叠体只作用于直接子元素，避免把嵌套层级一起藏掉 */
        .is-collapsed > [data-collapse-body] { display: none; }

        @media (prefers-color-scheme: dark) {
            .edit-toggle .chev { color: #4b5563; }
            .edit-toggle:hover .chev { color: #60a5fa; }
            .edit-toggle:hover > span:first-of-type { color: #93c5fd; }
        }

        /* ===== 拖动排序 ===== */

        /* 排序模式下可拖元素的手型与禁止浏览器接管手势 */
        body.sort-mode [data-drag] {
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body.sort-mode [data-drag]:active { cursor: grabbing; }

        /* 排序模式高亮：让「哪些能拖」一眼可见 */
        body.sort-mode [data-drag="group"] { border-radius: 8px; }
        body.sort-mode [data-drag="group"]:hover { background: rgba(59, 130, 246, .06); }
        body.sort-mode [data-drag="cat"]:hover { background: rgba(59, 130, 246, .08); border-radius: 6px; }
        body.sort-mode [data-drag="item"]:hover { border-color: #93c5fd; }

        /* 跟随指针的克隆体：只动 transform，交给合成层 */
        .drag-ghost {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            margin: 0 !important;
            pointer-events: none !important;
            z-index: 90;
            opacity: .96;
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .22), 0 2px 6px rgba(15, 23, 42, .12);
            will-change: transform;
            transition: none !important;
        }

        /* 原位占位：保留布局空间，让其它元素知道「腾出的位置」 */
        .drag-placeholder { opacity: 0 !important; }

        /* FLIP 让位动画期间，禁用子元素自身的过渡干扰 */
        body.sort-mode [data-drag] { transition-property: transform, box-shadow; }

        /* 排序模式下其余操作本就禁用，小屏直接收起，避免工具条换行挤压内容 */
        @media (max-width: 639px) {
            body.sort-mode [data-tb]:not([data-tb="sort"]) { display: none; }
        }

        @media (prefers-color-scheme: dark) {
            .drag-ghost { box-shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4); }
            body.sort-mode [data-drag="group"]:hover { background: rgba(96, 165, 250, .1); }
            body.sort-mode [data-drag="cat"]:hover { background: rgba(96, 165, 250, .12); }
        }

        @media (prefers-reduced-motion: reduce) {
            body.sort-mode [data-drag] { transition: none; }
        }

        /* ===== 管理工具条按钮（纯 CSS，不依赖动态类名）===== */
        .tb-btn {
            flex-shrink: 0;
            height: 30px;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #4b5563;
            cursor: pointer;
            transition: background-color .15s, color .15s, border-color .15s;
        }
        .tb-btn:hover { background: #f9fafb; color: #111827; }
        .tb-btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .tb-btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
        .tb-btn:disabled, .tb-btn[disabled] {
            background: #f3f4f6; border-color: #e5e7eb; color: #c3c8d0;
            cursor: not-allowed; pointer-events: none;
        }
        @media (prefers-color-scheme: dark) {
            .tb-btn { background: #1f2937; border-color: #374151; color: #d1d5db; }
            .tb-btn:hover { background: #374151; color: #f9fafb; }
            .tb-btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
            .tb-btn-primary:hover { background: #1d4ed8; }
            .tb-btn:disabled, .tb-btn[disabled] { background: #111827; border-color: #1f2937; color: #4b5563; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-200 min-h-screen flex flex-col">

    <!-- ===== 顶栏 ===== -->
    <header
        class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-b border-gray-200/60 dark:border-gray-800/60">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 flex items-center gap-2 sm:gap-4">
            <h1 id="siteTitle"
                class="font-bold text-[15px] sm:text-lg tracking-tight text-blue-600 dark:text-blue-500 shrink-0 max-w-[40%] truncate cursor-pointer active:opacity-70 transition-opacity"
                title="回到顶部">My Nav</h1>

            <div class="flex-1 min-w-0 max-w-lg">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400 group-focus-within:text-blue-500 transition-colors"
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" autocomplete="off" spellcheck="false"
                        class="block w-full h-9 pl-9 pr-3 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-100/60 dark:bg-gray-800/60 placeholder-gray-500 text-[13px] sm:text-sm focus:outline-none focus:bg-white dark:focus:bg-black focus:ring-2 focus:ring-blue-500/30 transition-all"
                        placeholder="搜索">
                </div>
            </div>

            <button id="adminBtn" type="button"
                class="shrink-0 h-9 px-2.5 sm:px-3 rounded-lg text-[12px] sm:text-[13px] font-medium border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                管理
            </button>
        </div>
    </header>

    <!-- ===== 管理模式工具条 ===== -->
    <div id="toolbar" hidden
        class="sticky top-14 z-30 bg-white/90 dark:bg-gray-900/90 backdrop-blur-xl border-b border-gray-200/60 dark:border-gray-800/60">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-1.5 sm:py-0 sm:h-12 flex flex-wrap items-center gap-1.5 sm:gap-2">
            <span id="diffBadge" class="shrink-0 text-[12px] sm:text-[13px] whitespace-nowrap"></span>
            <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
                <button type="button" data-tb="preview" class="tb-btn" title="查看变更预览">变更</button>
                <button type="button" data-tb="sort" class="tb-btn" title="进入拖动排序模式">排序</button>
                <button type="button" data-tb="import" class="tb-btn" title="从 JSON 文件导入">导入</button>
                <button type="button" data-tb="export" class="tb-btn" title="导出为 JSON 文件">导出</button>
                <button type="button" data-tb="restore" class="tb-btn" title="恢复为线上版本">恢复</button>
                <button type="button" data-tb="push" class="tb-btn tb-btn-primary" title="推送到 GitHub">推送</button>
                <button type="button" data-tb="exit" class="tb-btn" title="退出管理模式">退出</button>
            </div>
        </div>
    </div>

    <!-- ===== 主体 ===== -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">
        <div id="listView"></div>
        <div id="searchView" hidden></div>
    </main>

    <!-- ===== 弹窗挂载点 / 隐藏的导入 input ===== -->
    <div id="modalRoot"></div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>

    <script src="app.js"></script>
</body>

</html>
